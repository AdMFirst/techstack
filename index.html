<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemilih Arsitektur Sistem</title>
<style>
  :root{
    --bd:#cfcfcf; --bd2:#e6e6e6; --soft:#f6f6f6; --ink:#141414;
    --accent:#141414; --ok:#0a7a2f; --warn:#8a5a00; --bad:#b00020;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:#f0f0f0; color:var(--ink); font-size:15px; line-height:1.5;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header.site{background:#fff;border-bottom:1px solid var(--bd);padding:1rem 1.25rem;}
  header.site h1{margin:0;font-size:1.2rem;letter-spacing:-.01em;}
  header.site p{margin:.2rem 0 0;font-size:.85rem;color:#555;}
  main{max-width:820px;margin:0 auto;padding:1.5rem 1.25rem 5rem;}
  .card{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:1.25rem 1.4rem;}
  h2{font-size:1.15rem;margin:0 0 .5rem;letter-spacing:-.01em;}
  h3{font-size:1rem;margin:1.5rem 0 .4rem;}
  p{margin:.5rem 0;}
  .muted{color:#666;font-size:.85rem;}
  .small{font-size:.85rem;}
  hr{border:none;border-top:1px solid var(--bd2);margin:1.25rem 0;}

  button{
    font:inherit;font-size:.9rem;padding:.5rem .9rem;border-radius:4px;cursor:pointer;
    border:1px solid #444;background:#fff;color:inherit;
  }
  button:hover:not(:disabled){background:#141414;color:#fff;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:#141414;color:#fff;border-color:#141414;}
  button.primary:hover:not(:disabled){background:#000;}
  button.ghost{border-color:var(--bd);color:#555;}
  button.ghost:hover{background:#eee;color:#111;}
  button.download{border-color:#0a7a2f;color:#0a7a2f;}
  button.download:hover:not(:disabled){background:#0a7a2f;color:#fff;}

  .intro ul{padding-left:1.2rem;margin:.6rem 0;}
  .intro li{margin-bottom:.35rem;font-size:.9rem;}

  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
         font-size:.8rem;color:#666;margin-bottom:.35rem;}
  .track{height:6px;background:var(--bd2);border-radius:3px;overflow:hidden;margin-bottom:1.4rem;}
  .fill{height:100%;width:0;background:#141414;transition:width .18s ease;}
  .qtitle{font-size:1.12rem;font-weight:600;margin:0 0 .15rem;letter-spacing:-.01em;}
  .qhint{font-size:.84rem;color:#666;margin:0 0 1rem;}

  .opt{
    display:flex;align-items:flex-start;gap:.6rem;border:1px solid var(--bd);
    border-radius:5px;padding:.6rem .75rem;margin-bottom:.45rem;background:#fff;
    transition:border-color .1s, background .1s;
  }
  .opt:hover{border-color:#888;}
  .opt.sel{border-color:#141414;background:#f8f8f8;}
  .opt label{display:flex;gap:.6rem;flex:1;cursor:pointer;align-items:flex-start;margin:0;}
  .opt input[type=checkbox]{margin:.22rem 0 0;flex:none;width:1rem;height:1rem;accent-color:#141414;}
  .opt .txt{font-size:.92rem;}
  .opt .num{
    flex:none;font-size:.75rem;color:#999;border:1px solid var(--bd2);border-radius:3px;
    padding:0 .3rem;line-height:1.3;margin-top:.15rem;
  }
  .opt .imp{
    visibility:hidden;flex:none;font-size:.72rem;padding:.2rem .45rem;border-radius:3px;
    border:1px solid var(--bd);background:#fff;cursor:pointer;white-space:nowrap;line-height:1.2;
  }
  .opt.sel .imp{visibility:visible;}
  .opt.imp-on .imp{background:#141414;color:#fff;border-color:#141414;}
  .opt.imp-on{border-color:#141414;}

  .navbar{display:flex;gap:.5rem;align-items:center;margin-top:1.5rem;flex-wrap:wrap;}
  .navbar .spacer{flex:1;}

  .res{border:1px solid var(--bd);border-radius:6px;padding:1rem 1.1rem;margin-bottom:.75rem;background:#fff;}
  .res.top{border-width:2px;border-color:#141414;background:#fff;}
  .res-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;}
  .res-name{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;}
  .res-rank{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.06em;}
  .res-tag{font-size:.85rem;color:#555;margin:.15rem 0 .5rem;}
  .bar{height:10px;background:var(--bd2);border-radius:5px;overflow:hidden;margin:.5rem 0 .3rem;}
  .bar > i{display:block;height:100%;background:#141414;}
  .res.top .bar > i{background:#0a7a2f;}
  .res-meta{font-size:.78rem;color:#777;display:flex;justify-content:space-between;gap:1rem;}
  details{margin-top:.7rem;border-top:1px solid var(--bd2);padding-top:.6rem;}
  details summary{cursor:pointer;font-size:.85rem;font-weight:600;color:#333;outline:none;}
  details summary:hover{color:#000;}
  details[open] summary{margin-bottom:.5rem;}
  .dgrid{display:grid;grid-template-columns:1fr;gap:.9rem;}
  @media(min-width:640px){.dgrid{grid-template-columns:1fr 1fr;}}
  .dsec h4{margin:0 0 .25rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#666;}
  .dsec ul{margin:0;padding-left:1.1rem;font-size:.85rem;}
  .dsec li{margin-bottom:.2rem;}
  .why{font-size:.85rem;}
  .why ul{margin:.25rem 0 .6rem;padding-left:1.1rem;}
  .why li{margin-bottom:.25rem;}
  .why .qs{color:#888;}
  .pos{color:var(--ok);font-weight:600;}
  .neg{color:var(--bad);font-weight:600;}

  .note{border-left:3px solid #999;background:var(--soft);padding:.6rem .8rem;font-size:.85rem;
        border-radius:0 4px 4px 0;margin:1rem 0;}
  .note.warn{border-left-color:var(--warn);}
  .btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.5rem;}
  .toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);
         background:#141414;color:#fff;padding:.5rem .9rem;border-radius:4px;font-size:.85rem;
         opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
  .toast.on{opacity:1;}

  @media print{
    body{background:#fff;}
    header.site,.btnrow,.toast,.navbar{display:none !important;}
    main{max-width:none;padding:0;}
    .card{border:none;padding:0;}
    .res{page-break-inside:avoid;}
    details{display:block;}
    details > *{display:block !important;}
  }
</style>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>

<main id="app"></main>
<div class="toast" id="toast"></div>

   1. ARSITEKTUR

/* =========================================================
   3. STATE
   ========================================================= */

const state = {
    index: 0,
    answers: {}
};

/* Hitung poin maksimum per arsitektur per pertanyaan. */
QUESTIONS.forEach(q => {
    q.max = {};
    ARCHS.forEach(a => {
        let m = 0;
        q.opts.forEach(o => {
            const v = o.e[a.id] || 0;
            if (v > m) m = v;
        });
        q.max[a.id] = m;
    });
});

/* =========================================================
   4. UTILITAS
   ========================================================= */

const $ = sel => document.querySelector(sel);
const app = $('#app');

function esc(s){
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('on'), 2000);
}

function answeredCount(){
    return Object.keys(state.answers).filter(k => {
        const m = state.answers[k];
        return m && Object.keys(m).some(i => m[i]);
    }).length;
}

function renderQuestion(){
    const q = QUESTIONS[state.index];
    const total = QUESTIONS.length;
    const n = state.index + 1;
    const pct = Math.round(((n - 1) / total) * 100);
    const sel = state.answers[q.id] || {};

    const optsHtml = q.opts.map((o, i) => {
        const v = sel[i] || 0;
        const cls = 'opt' + (v ? ' sel' : '') + (v === 2 ? ' imp-on' : '');
        return `
            <div class="${cls}" data-i="${i}">
                <span class="num">${i + 1}</span>
                <label>
                    <input type="checkbox" ${v ? 'checked' : ''} data-i="${i}">
                    <span class="txt">${esc(o.t)}</span>
                </label>
                <button type="button" class="imp" data-i="${i}" title="Tandai sebagai kriteria sangat penting — Bobot nilai digandakan">×2 Prioritas Utama</button>
            </div>
        `;
    }).join('');

    app.innerHTML = `
        <div class="card">
            <div class="qhead">
                <span>Pertanyaan ${n} dari ${total}</span>
                <span>${answeredCount()} Terisi</span>
            </div>
            <div class="track"><div class="fill" style="width:${pct}%"></div></div>

            <h2 class="qtitle">${esc(q.q)}</h2>
            ${q.hint ? `<p class="qhint">${esc(q.hint)}</p>` : '<div style="height:.75rem"></div>'}

            <div id="opts">${optsHtml}</div>

            <div class="navbar">
                <button class="ghost" id="back" ${state.index === 0 ? 'disabled' : ''}>← Kembali</button>
                <button class="ghost" id="skip">Lewati</button>
                <span class="spacer"></span>
                <button class="primary" id="next">${n === total ? 'Lihat Rekomendasi' : 'Lanjut →'}</button>
            </div>
            <p class="small muted" style="margin-top:.75rem">
                Navigasi cepat: Gunakan tombol angka <strong>1–9</strong> untuk memilih, dan <strong>Enter</strong> untuk melanjutkan.
            </p>
        </div>
    `;

    app.querySelectorAll('.opt input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => toggleOption(q.id, parseInt(cb.dataset.i, 10)));
    });

    app.querySelectorAll('.opt .imp').forEach(btn => {
        btn.addEventListener('click', ev => {
            ev.preventDefault();
            ev.stopPropagation();
            setImportant(q.id, parseInt(btn.dataset.i, 10));
        });
    });

    $('#back').addEventListener('click', () => { state.index--; renderQuestion(); });
    $('#skip').addEventListener('click', () => nextQuestion());
    $('#next').addEventListener('click', () => nextQuestion());
}

function toggleOption(qid, i){
    if (!state.answers[qid]) state.answers[qid] = {};
    const m = state.answers[qid];
    if (m[i]) delete m[i];
    else m[i] = 1;
    if (!Object.keys(m).length) delete state.answers[qid];
    renderQuestion();
}

function setImportant(qid, i){
    const m = state.answers[qid];
    if (!m || !m[i]) return;
    m[i] = m[i] === 2 ? 1 : 2;
    renderQuestion();
}

function nextQuestion(){
    if (state.index < QUESTIONS.length - 1) {
        state.index++;
        renderQuestion();
    } else {
        renderResults();
    }
}

/* =========================================================
   7. PENILAIAN
   ========================================================= */

function score(){
    const raw = {}, poss = {}, why = {};
    ARCHS.forEach(a => {
        raw[a.id] = 0;
        poss[a.id] = 0;
        why[a.id] = {pos:[], neg:[]};
    });

    let answered = 0;

    QUESTIONS.forEach(q => {
        const sel = state.answers[q.id];
        if (!sel) return;
        const idx = Object.keys(sel).map(Number).filter(i => sel[i]);
        if (!idx.length) return;
        answered++;

        ARCHS.forEach(a => { poss[a.id] += q.max[a.id]; });

        idx.forEach(i => {
            const o = q.opts[i];
            if (!o) return;
            const w = sel[i] === 2 ? 2 : 1;
            ARCHS.forEach(a => {
                const v = o.e[a.id] || 0;
                if (!v) return;
                raw[a.id] += v * w;
                const entry = { q:q.q, o:o.t, v:v * w, w:w };
                if (v > 0) why[a.id].pos.push(entry);
                else why[a.id].neg.push(entry);
            });
        });
    });

    const results = ARCHS.map(a => {
        const r = raw[a.id];
        const p = poss[a.id];
        let pct = p > 0 ? (r / p) * 100 : 0;
        pct = Math.max(0, Math.min(100, pct));
        return {
            arch: a,
            raw: r,
            possible: p,
            pct: Math.round(pct),
            pos: why[a.id].pos.sort((x, y) => y.v - x.v).slice(0, 5),
            neg: why[a.id].neg.sort((x, y) => x.v - y.v).slice(0, 4)
        };
    });

    results.sort((x, y) => y.pct - x.pct || y.raw - x.raw);
    return { results, answered };
}

function buildExportData(){
    const { results, answered } = score();
    const now = new Date();

    // Build answer log with questions
    const answerLog = QUESTIONS.map((q, qIdx) => {
        const sel = state.answers[q.id] || {};
        const selectedIndices = Object.keys(sel)
            .filter(i => sel[i])
            .map(i => parseInt(i, 10));

        const selectedOptions = selectedIndices.map(i => ({
            index: i,
            text: q.opts[i].t,
            isPriority: sel[i] === 2
        }));

        const allOptions = q.opts.map((o, idx) => ({
            index: idx,
            text: o.t,
            isSelected: selectedIndices.includes(idx),
            isPriority: selectedIndices.includes(idx) && sel[idx] === 2
        }));

        return {
            questionNumber: qIdx + 1,
            questionId: q.id,
            question: q.q,
            hint: q.hint || null,
            selectedOptions: selectedOptions,
            allOptions: allOptions,
            wasAnswered: selectedIndices.length > 0
        };
    });

    // Build results
    const resultData = results.map((r, i) => {
        const label = r.pct >= 70 ? 'Sangat Direkomendasikan'
                    : r.pct >= 45 ? 'Cukup Sesuai'
                    : r.pct >= 20 ? 'Kurang Sesuai'
                    : 'Tidak Direkomendasikan';

        return {
            rank: i + 1,
            architectureId: r.arch.id,
            architectureName: r.arch.name,
            tagline: r.arch.tag,
            description: r.arch.about,
            score: r.raw,
            possibleScore: r.possible,
            percentage: r.pct,
            label: label,
            positiveFactors: r.pos.map(p => ({
                question: p.q,
                option: p.o,
                scoreValue: p.v,
                isPriority: p.w === 2
            })),
            negativeFactors: r.neg.map(p => ({
                question: p.q,
                option: p.o,
                scoreValue: p.v,
                isPriority: p.w === 2
            })),
            stack: r.arch.stack,
            pros: r.arch.pros,
            cons: r.arch.cons,
            watch: r.arch.watch
        };
    });

    return {
        metadata: {
            title: 'Laporan Evaluasi Arsitektur Sistem',
            generatedAt: now.toISOString(),
            generatedAtLocal: now.toLocaleString('id-ID'),
            totalQuestions: QUESTIONS.length,
            answeredQuestions: answered,
            topRecommendation: resultData[0] ? resultData[0].architectureName : null,
            topScore: resultData[0] ? resultData[0].percentage : 0
        },
        answers: answerLog,
        results: resultData
    };
}

    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });

    const a = document.createElement('a');

/* =========================================================
   9. PERMALINK
   ========================================================= */

function encodeState(){
    const o = {};
    QUESTIONS.forEach(q => {
        const m = state.answers[q.id];
        if (!m) return;
        const parts = Object.keys(m)
            .filter(i => m[i])
            .map(i => i + (m[i] === 2 ? '!' : ''));
        if (parts.length) o[q.id] = parts.join('.');
    });
    try {
        return btoa(encodeURIComponent(JSON.stringify(o)));
    } catch (e) {
        return '';
    }
}

function loadFromHash(){
    const h = location.hash.replace(/^#/, '');
    if (!h) return false;
    try {
        const o = JSON.parse(decodeURIComponent(atob(h)));
        const answers = {};
        QUESTIONS.forEach(q => {
            const v = o[q.id];
            if (!v) return;
            const m = {};
            String(v).split('.').forEach(p => {
                const imp = p.endsWith('!');
                const i = parseInt(imp ? p.slice(0, -1) : p, 10);
                if (!isNaN(i) && q.opts[i]) m[i] = imp ? 2 : 1;
            });
            if (Object.keys(m).length) answers[q.id] = m;
        });
        if (!Object.keys(answers).length) return false;
        state.answers = answers;
        return true;
    } catch (e) {
        return false;
    }
}

/* =========================================================
   10. PINTASAN KEYBOARD
   ========================================================= */

document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') {
        if (ev.key === 'Enter' && tag !== 'textarea') {
            ev.preventDefault();
            if ($('#next') && !$('#next').disabled) $('#next').click();
        }
        return;
    }
    if (!$('#opts')) return;
    const q = QUESTIONS[state.index];

    if (/^[1-9]$/.test(ev.key)) {
        const i = parseInt(ev.key, 10) - 1;
        if (i < q.opts.length) { ev.preventDefault(); toggleOption(q.id, i); }
    } else if (ev.key === 'Enter' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        if ($('#next')) $('#next').click();
    } else if (ev.key === 'ArrowLeft') {
        ev.preventDefault();
        if ($('#back') && !$('#back').disabled) $('#back').click();
    }
});

/* =========================================================
   11. START
   ========================================================= */

(function boot(){
    document.title = 'Pemilih Arsitektur Sistem';
    if (loadFromHash()) renderResults();
    else renderIntro();
})();
</script>
